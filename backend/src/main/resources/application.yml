spring:
  application:
    name: seafish-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8081

seafish:
  storage:
    root: ${SEAFISH_STORAGE_ROOT:./uploads}
  detection:
    provider: ${SEAFISH_DETECTION_PROVIDER:demo}
